<div class="flex min-h-screen flex-col bg-paper">
  <header class="sticky top-0 z-40 border-b border-line bg-paper/85 backdrop-blur">
    <div
      class="mx-auto flex w-full max-w-6xl items-center justify-between gap-4 px-4 py-3.5 sm:px-6"
    >
      <h1>
        <a class="flex items-center gap-2.5" routerLink="/">
          <span class="h-2.5 w-2.5 shrink-0 rounded-[2px] bg-pine-600" aria-hidden="true"></span>
          <span class="font-display text-lg font-semibold tracking-tight">Document Assistant</span>
        </a>
      </h1>

      @if (auth.session(); as session) {
        <nav class="hidden items-center gap-6 md:flex" aria-label="Account">
          <a
            class="nav-link py-2 text-sm font-medium"
            routerLink="/ask"
            routerLinkActive="nav-active"
          >
            Ask
          </a>
          <a
            class="nav-link py-2 text-sm font-medium"
            routerLink="/my-documents"
            routerLinkActive="nav-active"
          >
            My documents
          </a>
          <span class="hidden max-w-xs truncate text-sm text-muted lg:inline">
            {{ session.email }}
          </span>
          <button
            class="rounded-lg border border-line px-3.5 py-2 text-sm font-medium text-ink transition hover:border-pine-300 hover:bg-pine-50"
            type="button"
            (click)="signOut()"
          >
            Sign out
          </button>
        </nav>
      } @else {
        <nav class="hidden items-center gap-6 md:flex" aria-label="Account">
          <a class="nav-link py-2 text-sm font-medium" routerLink="/auth">Login</a>
          <a
            class="rounded-lg bg-pine-700 px-4 py-2 text-sm font-semibold text-paper transition hover:bg-pine-800"
            routerLink="/auth"
            [queryParams]="{ mode: 'register' }"
          >
            Register
          </a>
        </nav>
      }

      <button
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-ink transition hover:bg-pine-50 md:hidden"
        type="button"
        aria-label="Toggle navigation"
        aria-controls="mobile-nav"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg
            aria-hidden="true"
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        } @else {
          <svg
            aria-hidden="true"
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        }
      </button>
    </div>

    @if (menuOpen()) {
      <nav
        class="border-t border-line bg-paper px-4 pb-4 pt-2 md:hidden"
        id="mobile-nav"
        aria-label="Mobile"
      >
        <div class="flex flex-col gap-1">
          @if (auth.session(); as session) {
            <p class="truncate px-3 py-2 text-sm text-muted">
              {{ session.email }}
            </p>
            <a
              class="nav-link rounded-lg px-3 py-2.5 text-sm font-medium"
              routerLink="/ask"
              routerLinkActive="nav-active"
              (click)="closeMenu()"
            >
              Ask
            </a>
            <a
              class="nav-link rounded-lg px-3 py-2.5 text-sm font-medium"
              routerLink="/my-documents"
              routerLinkActive="nav-active"
              (click)="closeMenu()"
            >
              My documents
            </a>
            <button
              class="rounded-lg px-3 py-2.5 text-left text-sm font-medium text-ink transition hover:bg-pine-50"
              type="button"
              (click)="signOut()"
            >
              Sign out
            </button>
          } @else {
            <a
              class="nav-link rounded-lg px-3 py-2.5 text-sm font-medium"
              routerLink="/auth"
              (click)="closeMenu()"
            >
              Login
            </a>
            <a
              class="rounded-lg bg-pine-700 px-3 py-2.5 text-center text-sm font-semibold text-paper transition hover:bg-pine-800"
              routerLink="/auth"
              [queryParams]="{ mode: 'register' }"
              (click)="closeMenu()"
            >
              Register
            </a>
          }
        </div>
      </nav>
    }
  </header>

  <main class="flex-1 px-4 py-8 sm:px-6 sm:py-10">
    <div class="mx-auto w-full max-w-6xl">
      <router-outlet />
    </div>
  </main>
</div>
