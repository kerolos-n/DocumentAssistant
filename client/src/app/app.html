<main class="min-h-screen bg-slate-50 px-4 py-8 text-slate-900">
  <div class="mx-auto max-w-5xl">
    <header
      class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 pb-5"
    >
      <h1 class="text-2xl font-bold">Document Assistant</h1>
      <nav class="flex items-center gap-4" aria-label="Account">
        @if (auth.session(); as session) {
          <span class="hidden text-sm text-slate-600 sm:inline">{{ session.email }}</span>
          <button
            class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-white"
            type="button"
            (click)="signOut()"
          >
            Sign out
          </button>
        } @else {
          <a
            class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-white"
            routerLink="/auth"
          >
            Login
          </a>
          <a
            class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700"
            routerLink="/auth"
            [queryParams]="{ mode: 'register' }"
          >
            Register
          </a>
        }
      </nav>
    </header>
    <router-outlet />
  </div>
</main>
